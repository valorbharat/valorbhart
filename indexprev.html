<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALOR | The Intelligence Behind Public Procurement</title>
    <meta name="description" content="Sovereign-grade public procurement consultancy in Gujarat. Specializing in GeM profile architecture, risk defense, and financial bid optimization.">
    <meta name="keywords" content="GeM consultant Gujarat, public procurement India, tender bidding strategy, government tenders">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

		<style>
        :root {
            --dark-bg: #0a0a1a;
            --dark-secondary: #141428;
            --gold: #d4af37;
            --gold-light: #f0d878;
            --light-red: #d97b7b;
            --light-red-bg: #fff5f5;
            --cream: #f8f6f0;
            --white: #ffffff;
            --dark-text: #1a1a1a;
            --gray: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--dark-bg);
            color: var(--white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        a { text-decoration: none; color: inherit; }

			
        /* WhatsApp Floating Button */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float i {
            color: white;
            font-size: 28px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 3px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover { color: var(--gold); }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s;
        }

        .nav-links a:hover::after { width: 100%; }

        .linkedin-nav {
            color: var(--gold) !important;
            font-size: 18px !important;
        }

        .mobile-menu {
            display: none;
            font-size: 24px;
            color: var(--gold);
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 60px;
            background:
                linear-gradient(180deg, rgba(10,10,26,0.88) 0%, rgba(10,10,26,0.97) 100%),
                url('Webfoto/hero-bg.png') center/cover no-repeat,
                linear-gradient(180deg, var(--dark-secondary) 0%, var(--dark-bg) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--light-red);
        }

        .hero-logo {
            width: 280px;
            max-width: 80%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.3));
            cursor: pointer;
            transition: transform 0.3s;
        }

        .hero-logo:hover { transform: scale(1.03); }

        .hero-tagline {
            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .hero-tagline:hover { color: var(--gold-light); }

        .gold-line {
            width: 120px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 30px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero h1 a {
            color: var(--white);
            transition: color 0.3s;
        }

        .hero h1 a:hover { color: var(--gold); }

        .hero-subtitle {
            color: var(--gold);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 50px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin-bottom: 50px;
        }

        .stat-box {
            background: rgba(26, 26, 46, 0.8);
            border: 1.5px solid var(--gold);
            border-radius: 10px;
            padding: 25px 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--white);
            font-weight: 600;
            line-height: 1.4;
        }

        .hero-quote {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid var(--light-red);
            border-radius: 10px;
            padding: 25px 40px;
            max-width: 800px;
            margin: 0 auto;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .hero-quote:hover { border-color: var(--gold); }

        .hero-quote p {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            font-style: italic;
            line-height: 1.6;
        }

        .hero-quote span {
            color: var(--light-red);
            font-size: 13px;
            display: block;
            margin-top: 10px;
        }

        /* Section Headers */
        .section-header {
            background: var(--dark-bg);
            padding: 40px 50px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .section-header h2 {
            color: var(--gold);
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: color 0.3s;
            display: inline-block;
        }

        .section-header h2:hover { color: var(--gold-light); }

        .section-header h2 a {
            color: var(--gold);
            transition: color 0.3s;
        }

        .section-header h2 a:hover { color: var(--gold-light); }

        .section-header p {
            color: var(--white);
            font-size: 13px;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Pain Solution Proof */
        .psp-section {
            background: var(--cream);
            padding: 60px 50px;
        }

        .psp-table {
            max-width: 1100px;
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }

        .psp-table th {
            background: var(--dark-bg);
            color: var(--gold);
            padding: 18px 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border: 1.5px solid var(--gold);
        }

        .psp-table td {
            padding: 22px 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.6;
            border: 1.5px solid var(--gold);
            vertical-align: middle;
        }

        .psp-table tr:nth-child(even) { background: var(--white); }
        .psp-table tr:nth-child(odd) { background: #fafafa; }

        .psp-pain { color: var(--light-red); font-weight: 700; }
        .psp-solution { color: var(--dark-text); font-weight: 700; }
        .psp-proof { color: #1a5c1a; font-weight: 700; }

        .psp-quote {
            background: var(--dark-bg);
            border-radius: 10px;
            padding: 30px 40px;
            max-width: 900px;
            margin: 40px auto 0;
            text-align: center;
        }

        .psp-quote p {
            color: var(--gold);
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
        }

        .psp-quote span {
            color: var(--light-red);
            font-size: 13px;
            font-style: italic;
            display: block;
            margin-top: 12px;
        }

        /* Flywheel Section */
        .flywheel-section {
            background: var(--cream);
            padding: 0 50px 60px;
        }

        .flywheel-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .flywheel-step {
            background: var(--dark-bg);
            border: 1.5px solid var(--gold);
            border-radius: 10px;
            padding: 25px 30px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .flywheel-step:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.15);
        }

        .flywheel-step::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--light-red);
        }

        .flywheel-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
        }

        .flywheel-step h3 {
            color: var(--gold);
            font-size: 20px;
            font-weight: 800;
        }

        .flywheel-step .subtitle {
            color: var(--gray);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flywheel-bullets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 30px;
            margin-top: 10px;
        }

        .flywheel-bullets li {
            color: var(--white);
            font-size: 12px;
            font-weight: 500;
            list-style: none;
            padding-left: 15px;
            position: relative;
        }

        .flywheel-bullets li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--gold);
        }

        .flywheel-arrow {
            text-align: center;
            color: var(--light-red);
            font-size: 24px;
            margin: -5px 0;
        }

        .dual-badges {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 15px 35px;
            border-radius: 8px;
            text-align: center;
            min-width: 200px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .badge:hover { transform: translateY(-3px); }

        .badge.consulting { background: var(--light-red); }
        .badge.trading { background: var(--gold); }

        .badge h4 {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .badge.consulting h4 { color: var(--white); }
        .badge.trading h4 { color: var(--dark-bg); }

        .badge p {
            font-size: 11px;
            font-weight: 600;
        }

        .badge.consulting p { color: rgba(255,255,255,0.9); }
        .badge.trading p { color: var(--dark-bg); opacity: 0.8; }

        /* Trusted Clients */
        .clients-section {
            background: var(--cream);
            padding: 0 50px 60px;
        }

        .clients-grid {
            max-width: 1100px;
            margin: 0 auto;
        }

        .client-tier {
            margin-bottom: 35px;
        }

        .client-tier h3 {
            color: var(--gold);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-block;
            transition: color 0.3s;
        }

        .client-tier h3:hover { color: var(--gold-light); }

        .tier-line {
            width: 80px;
            height: 2px;
            background: var(--gold);
            margin-bottom: 18px;
        }

        .client-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .client-badge {
            background: var(--light-red-bg);
            border: 1px solid var(--light-red);
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--dark-text);
            transition: all 0.3s;
            cursor: pointer;
        }

        .client-badge:hover {
            background: var(--light-red);
            color: var(--white);
            transform: translateY(-2px);
        }

        .clients-bottom {
            background: var(--dark-bg);
            border-radius: 10px;
            padding: 25px 30px;
            text-align: center;
            margin-top: 20px;
        }

        .clients-bottom h4 {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            cursor: pointer;
            display: inline-block;
            transition: color 0.3s;
        }

        .clients-bottom h4:hover { color: var(--gold-light); }

        .clients-bottom p {
            color: var(--white);
            font-size: 13px;
            opacity: 0.9;
        }

        /* Alliances */
        .alliances-section {
            background: var(--cream);
            padding: 0 50px 60px;
        }

        .alliances-table {
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }

        .alliances-table th {
            background: var(--dark-bg);
            color: var(--gold);
            padding: 18px 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
            border: 1.5px solid var(--gold);
        }

        .alliances-table td {
            padding: 20px;
            font-size: 13px;
            line-height: 1.5;
            border: 1.5px solid var(--gold);
            vertical-align: middle;
        }

        .alliances-table tr:nth-child(even) { background: var(--white); }
        .alliances-table tr:nth-child(odd) { background: #fafafa; }

        .alliance-name {
            color: var(--light-red);
            font-weight: 700;
            font-size: 12px;
        }

        .alliance-desc {
            color: var(--dark-text);
            font-weight: 500;
        }

        /* Leadership */
        .leadership-box {
            background: var(--dark-bg);
            border-radius: 10px;
            padding: 40px;
            max-width: 800px;
            margin: 40px auto 0;
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }

        .leadership-box:hover {
            box-shadow: 0 5px 25px rgba(212, 175, 55, 0.15);
        }

        .leadership-box h3 {
            color: var(--gold);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .leadership-box h3:hover { color: var(--gold-light); }

        .leadership-box .role {
            color: var(--gray);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .leadership-box .quote {
            color: var(--light-red);
            font-size: 14px;
            font-style: italic;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Contact Form Section */
        .contact-form-section {
            background: linear-gradient(180deg, var(--dark-secondary) 0%, var(--dark-bg) 100%);
            padding: 80px 50px;
            text-align: center;
            position: relative;
        }

        .contact-form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--light-red);
        }

        .contact-form-section h2 {
            color: var(--gold);
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            cursor: pointer;
            display: inline-block;
            transition: color 0.3s;
        }

        .contact-form-section h2:hover { color: var(--gold-light); }

        .contact-form-section .sub-text {
            color: var(--white);
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(26, 26, 46, 0.6);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--gray);
            font-size: 13px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            color: var(--dark-bg);
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .form-note {
            text-align: center;
            color: var(--gray);
            font-size: 11px;
            margin-top: 15px;
        }

        /* Contact Info Cards */
        .contact-info-section {
            background: var(--dark-bg);
            padding: 60px 50px;
            text-align: center;
        }

        .contact-logo {
            width: 200px;
            max-width: 60%;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            cursor: pointer;
            transition: transform 0.3s;
        }

        .contact-logo:hover { transform: scale(1.03); }

        .contact-info-section .tagline {
            color: var(--gold);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .contact-info-section h2 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.3s;
        }

        .contact-info-section h2:hover { color: var(--gold); }

        .contact-info-section .sub-text {
            color: var(--gold);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.8;
            margin-bottom: 50px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .contact-card {
            background: rgba(26, 26, 46, 0.8);
            border: 1.5px solid var(--light-red);
            border-radius: 10px;
            padding: 25px 30px;
            min-width: 220px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(217, 123, 123, 0.2);
        }

        .contact-card .label {
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .contact-card .value {
            color: var(--white);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .contact-card .sub {
            color: var(--gray);
            font-size: 11px;
        }

        /* Social Media */
        .social-section {
            margin-top: 30px;
        }

        .social-section p {
            color: var(--gray);
            font-size: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .linkedin-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0077b5;
            color: var(--white);
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .linkedin-btn:hover {
